name: hubx_example
description: Hubx example app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  auto_route: ^10.1.0
  dio: ^5.8.0+1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  gap: any
  flutter_screenutil: ^5.9.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  auto_route_generator: ^10.2.3
  build_runner: ^2.5.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.2
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.10.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/png/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600

l10n:
  arb-dir: lib/core/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations
