name: hubx_example
description: Hubx example app

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  auto_route: ^6.2.0
  dio: ^5.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  gap: any
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^2.4.5
  auto_route_generator: ^6.2.0
  build_runner: any
  bloc_test: ^9.1.5
  mocktail: ^1.0.2
  flutter_lints: ^3.0.1



flutter:

  uses-material-design: true
  assets:
    - assets/png/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
